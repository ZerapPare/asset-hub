services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: assethub
    ports: ["5432:5432"]
    # ไฟล์ใน db/migrations ถูกรันตามลำดับชื่อ เฉพาะตอนสร้าง volume ครั้งแรก
    # มี migration ใหม่ → รันเองใน DBeaver หรือ `docker compose down -v` แล้ว up ใหม่ (ข้อมูลหาย)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

# ใช้จำลองตัว S3 ของ AWS สำหรับเก็บไฟล์
  minio:
    image: quay.io/minio/minio 
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev
      MINIO_ROOT_PASSWORD: devdevdev
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata: